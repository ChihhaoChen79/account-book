<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="記帳" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>記帳</title>
  </head>
  <body>
    <div id="root"><p id="boot" style="font:16px -apple-system,sans-serif;padding:24px;color:#888">載入中…</p></div>
    <script>
      // 啟動失敗時把錯誤直接顯示在畫面上（避免一片空白看不出原因）
      (function () {
        function show(m) {
          var r = document.getElementById('root');
          if (r && document.getElementById('boot')) {
            r.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-all;font:14px/1.5 monospace;padding:24px;color:#c00">啟動失敗：\n' + String(m).replace(/</g, '&lt;') + '</pre>';
          }
        }
        window.addEventListener('error', function (e) { show(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
        window.addEventListener('unhandledrejection', function (e) { show(e.reason && (e.reason.stack || e.reason.message) || e.reason); });
        window.__bootFail = show;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
